<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大肥鱼 · 启动管理</title>
<style>body{font:16px system-ui;background:#eef4fa;color:#18324c;margin:0}main{max-width:1000px;margin:6vh auto;padding:26px}.card{background:white;border-radius:18px;padding:24px;margin:18px 0;box-shadow:0 5px 25px #18324c0a}h1{font-size:30px}h2{font-size:20px}button,input{font:inherit;padding:10px 16px;border-radius:9px;border:1px solid #ccd7e3}button{cursor:pointer;background:#f6f9fc;margin:5px}button.primary{background:#176bc0;color:white;border-color:#176bc0}button:disabled{opacity:.5;cursor:default}.services{display:grid;grid-template-columns:1fr 1fr;gap:14px}.status{padding:7px 12px;border-radius:20px;background:#edf2f7;display:inline-block}.on{background:#e4f6ed;color:#17613e}p{line-height:1.7}.muted{color:#61758a}#message{white-space:pre-wrap}a{color:#176bc0}@media(max-width:650px){.services{grid-template-columns:1fr}main{margin:0;padding:16px}}</style>
<main><h1>大肥鱼 · 启动管理</h1><p class="muted">本机管理入口独立运行，桥接停止后仍可从这里启动。</p>
<section class="card" id="login"><h2>管理入口</h2><form id="loginForm"><input id="token" type="password" required placeholder="管理令牌（不是QQ密码）" autocomplete="off"><button class="primary">进入</button></form><p class="muted">双击“一键启动.vbs”可启动服务并自动进入本机管理页。</p></section>
<section class="card" id="controls" hidden><p id="identity"></p><button class="primary" data-service="all" data-action="start">一键启动全部</button><button data-service="all" data-action="stop">停止全部</button><button data-service="all" data-action="restart">重启全部</button><button id="console">打开桥接控制台</button><button id="snowluma">QQ 接入 / 登录</button><div class="services" id="services"></div><p id="gateway"></p><p><a href="https://github.com/SnowLuma/SnowLuma/releases" target="_blank" rel="noreferrer">SnowLuma 官方发布页</a></p><p class="muted">一键启动会依次打开 QQ、SnowLuma、DSH 和桥接。首次授权或 QQ 登录仍需在界面完成；停止全部不退出 QQ，也不关闭本管理页。</p></section>
<section class="card"><h2>操作状态</h2><p id="message" role="status">请先进入管理入口。</p></section></main>
<script>
let credential=sessionStorage.getItem('bffManagerToken')||'', busy=false, last;
const params=new URLSearchParams(location.search); if(params.get('token')){credential=params.get('token');sessionStorage.setItem('bffManagerToken',credential);history.replaceState(null,'',location.pathname)}
const el=id=>document.getElementById(id); const say=text=>el('message').textContent=text;
async function api(url,body){const r=await fetch(url,{method:body?'POST':'GET',headers:{'x-console-token':credential,...(body?{'content-type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'操作失败');return d}
function button(text,service,action){const b=document.createElement('button');b.textContent=text;b.dataset.service=service;b.dataset.action=action;return b}
async function refresh(){try{last=await api('/api/manager/status');el('login').hidden=true;el('controls').hidden=false;el('identity').textContent=`QQ账号 ${last.account} · 管理员 ${last.owner} · 群 ${last.allow.groups.join('、')}`;el('services').replaceChildren();for(const [name,s]of Object.entries(last.services)){const card=document.createElement('div');card.className='card';const h=document.createElement('h2');h.textContent=({snowluma:'SnowLuma · QQ 网关',dsh:'DeepSeek Harness',bridge:'QQ 桥接'})[name];const p=document.createElement('p');p.className='status'+(s.running?' on':'');p.textContent=s.running?(s.owned?'运行中':'运行中（其他入口启动）'):(s.pid?'正在启动':'已停止');card.append(h,p);if(s.error){const e=document.createElement('p');e.textContent=s.error;card.append(e)}for(const[a,t]of[['start','启动'],['stop','停止'],['restart','重启']])card.append(button(t,name,a));el('services').append(card)}el('gateway').textContent=last.gateway.ready?'QQ 登录身份与在线状态已确认；实际收发请在测试会话验证':last.gateway.webuiRunning?'网关已启动，等待 QQ 接入或登录：点击“QQ 接入 / 登录”完成':'QQ 网关未运行：点击“一键启动全部”';for(const b of document.querySelectorAll('[data-action]'))b.disabled=busy||last.busy;if(last.busy)say(last.step);if(last.warning)say(last.warning);return true}catch(e){if(!busy)say(e.message);return false}}
document.addEventListener('click',async event=>{const b=event.target.closest('[data-action]');if(!b||busy)return;busy=true;say('正在'+b.textContent+'…');refresh();try{const result=await api('/api/manager/action',{service:b.dataset.service,action:b.dataset.action});say(result.step||'操作已完成，正在核对服务状态。')}catch(e){say(e.message)}finally{busy=false;await refresh()}});
el('loginForm').onsubmit=async event=>{event.preventDefault();credential=el('token').value.trim();sessionStorage.setItem('bffManagerToken',credential);if(await refresh())say('已进入管理入口。')};
el('snowluma').onclick=()=>window.open('http://127.0.0.1:'+(last?.gateway.webuiPort||5099)+'/', '_blank', 'noopener');
el('console').onclick=()=>{if(!last?.services.bridge.running){say('请先启动桥接服务。');return}window.open('http://127.0.0.1:'+last.consolePort+'/?token='+encodeURIComponent(credential),'_blank','noopener')};
if(credential)refresh().then(ok=>{if(ok)say('已进入管理入口。')});setInterval(()=>{if(credential)refresh()},3000);
</script></html>
